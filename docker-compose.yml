services:
  db:
    image: pgvector/pgvector:pg15
    container_name: prospire_postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-prospire_hq}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-prospire@2@26}
      - POSTGRES_USER=${DB_USER:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - prospire-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - prospire-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-odoo}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo:
    build: .
    container_name: prospire_app
    depends_on:
      - db
    ports:
      - "${ODOO_PORT:-8070}:8069"
      - "${LONGPOLLING_PORT:-8071}:8072"
    volumes:
      - prospire-web-data:/var/lib/odoo
      - prospire-logs:/var/log/odoo
      - ./odoo.conf:/opt/odoo/odoo.conf:ro
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-odoo}
      - DB_PASSWORD=${DB_PASSWORD:-prospire@2@26}
      - DB_NAME=${DB_NAME:-prospire_hq}
      - DB_PORT=5432
      - ADMIN_LOGIN=${ADMIN_LOGIN:-prospirenext@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-prospire@2@26}
      - BASE_URL=${BASE_URL:-https://hq.prospirenext.com}
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-hq.prospirenext.com}
      - SMTP_USER=${SMTP_USER:-prospirenext@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-cgnk vwjs yewk pgml}
    restart: unless-stopped
    networks:
      - prospire-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8069/web/login" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: pgvector/pgvector:pg15
    container_name: prospire_backup
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-odoo}
      - DB_PASSWORD=${DB_PASSWORD:-prospire@2@26}
      - DB_NAME=${DB_NAME:-prospire_hq}
      - PGPASSWORD=${DB_PASSWORD:-prospire@2@26}
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c '
      while true; do
        echo "Creating backup..."
        pg_dump -h db -U "$${DB_USER}" -d "$${DB_NAME}" > /backups/$${DB_NAME}_backup_$$(date +%%Y%%m%%d_%%H%%M%%S).sql
        echo "Backup completed. Cleaning old backups..."
        ls -t /backups/*.sql | tail -n +8 | xargs rm -f 2>/dev/null || true
        echo "Sleeping for 24 hours..."
        sleep 86400
      done
      '
    restart: unless-stopped
    networks:
      - prospire-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  prospire-db-data:
  prospire-web-data:
  prospire-logs:

networks:
  prospire-network:
    driver: bridge
