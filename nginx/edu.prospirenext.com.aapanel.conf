# ============================================================
# nginx config for edu.prospirenext.com (ProspireNext Learning)
# ============================================================
# This file is meant to REPLACE aaPanel's generated site config
# at /www/server/panel/vhost/nginx/edu.prospirenext.com.conf
# after you have created the edu.prospirenext.com site in aaPanel
# and applied an SSL certificate.

upstream odoo_prospire {
    server 127.0.0.1:8070 weight=1 fail_timeout=0;
}

upstream odoo_prospire_longpolling {
    server 127.0.0.1:8071 weight=1 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name edu.prospirenext.com;

    # SSL certificates (managed by aaPanel)
    ssl_certificate    /www/server/panel/vhost/cert/edu.prospirenext.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/edu.prospirenext.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    # HTTP → HTTPS redirect
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # Logging
    access_log /www/wwwlogs/edu.prospirenext.com.log;
    error_log /www/wwwlogs/edu.prospirenext.com.error.log;

    # Proxy timeouts (Odoo can be slow on first load)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Gzip compression
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip_vary on;

    # Increase max body size for file uploads
    client_max_body_size 200M;

    # Proxy headers — CRITICAL for Odoo behind reverse proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;

    # Proxy settings
    proxy_redirect off;
    proxy_buffering off;

    # Longpolling / websocket support
    location /websocket {
        proxy_pass http://odoo_prospire_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /longpolling {
        proxy_pass http://odoo_prospire_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /web/assets {
        proxy_pass http://odoo_prospire;
        proxy_cache_valid 200 1d;
        proxy_buffering on;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /web/content {
        proxy_pass http://odoo_prospire;
        proxy_cache_valid 200 1d;
        proxy_buffering on;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Learning site: root goes to the course catalog
    location = / {
        proxy_pass http://odoo_prospire/slides;
    }

    # Main Odoo proxy
    location / {
        proxy_pass http://odoo_prospire;
    }
}
