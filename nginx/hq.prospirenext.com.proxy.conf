# ============================================================
# Reverse-proxy rules for hq.prospirenext.com in aaPanel
# ============================================================
# Copy this file OVER the existing aaPanel proxy file:
#   /www/server/panel/vhost/nginx/proxy/hq.prospirenext.com/202d6cfa89d278f3f39c8bf2432aadf1_hq.prospirenext.com.conf
# then reload nginx:  nginx -t && systemctl reload nginx
#
# This keeps hq.prospirenext.com as the internal ERP entry point and
# sends any public course URLs to edu.prospirenext.com.

upstream odoo_prospire {
    server 127.0.0.1:8070 weight=1 fail_timeout=0;
}

upstream odoo_prospire_longpolling {
    server 127.0.0.1:8071 weight=1 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

#PROXY-START/
location /slides {
    return 301 https://edu.prospirenext.com$request_uri;
}

location /longpolling {
    proxy_pass http://odoo_prospire_longpolling;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
}

location /websocket {
    proxy_pass http://odoo_prospire_longpolling;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
}

location /web/assets {
    proxy_pass http://odoo_prospire;
    proxy_cache_valid 200 1d;
    proxy_buffering on;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

location /web/content {
    proxy_pass http://odoo_prospire;
    proxy_cache_valid 200 1d;
    proxy_buffering on;
    expires 1d;
    add_header Cache-Control "public, immutable";
}

location /
{
    proxy_pass http://odoo_prospire;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    add_header X-Cache $upstream_cache_status;

    set $static_file 0;
    if ( $uri ~* "\.(gif|png|jpg|css|js|woff|woff2)$" )
    {
        set $static_file 1;
        expires 1m;
    }
    if ( $static_file = 0 )
    {
        add_header Cache-Control no-cache;
    }
}
#PROXY-END/
