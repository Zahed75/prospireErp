smtp_user = prospirenext@gmail.com
smtp_password = tmxx nglq gguu frzm
smtp_ssl = False

; Worker settings for VPS stability
; workers=0 runs Odoo as a single process. This is more stable for module
; install/uninstall on a VPS because it avoids worker OOM kills and registry
; reload issues that cause 502 Bad Gateway.
workers = 0
limit_request = 8192
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 1

; Security
